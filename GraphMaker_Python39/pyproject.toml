[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmaker-python39"
version = "1.4.0+py39"
description = "Python 3.9-compatible GraphMaker for measurement-data comparison"
requires-python = ">=3.9"
dependencies = [
  "openpyxl==3.1.5",
]

[project.scripts]
graphmaker-python39 = "tga_analyzer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
